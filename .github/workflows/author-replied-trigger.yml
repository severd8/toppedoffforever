name: Trigger Author Replied

on:
  issue_comment:
    types: [created]

jobs:
  call-local-workflow:
    if: >
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == github.event.issue.user.login
    uses: ./.github/workflows/author-replied.yml
    with:
      project_number: 1
      target_status: "Author Replied"
    secrets:
      PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
