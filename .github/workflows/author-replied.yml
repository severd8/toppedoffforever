name: Author Replied

on:
  workflow_call:
    inputs:
      project_number:
        required: true
        type: number
      target_status:
        required: true
        type: string
    secrets:
      PROJECTS_TOKEN:
        required: true

jobs:
  move-item:
    runs-on: ubuntu-latest
    steps:
      - name: Move issue to target status
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PROJECT_NUMBER: ${{ inputs.project_number }}
          TARGET_STATUS: ${{ inputs.target_status }}
        shell: bash
        run: |
          set -euo pipefail

          QUERY='
          query($owner:String!, $repo:String!, $issueNumber:Int!, $projectNumber:Int!) {
            user(login:$owner) {
              projectV2(number:$projectNumber) {
                id
                fields(first:100) {
                  nodes {
                    ... on ProjectV2SingleSelectField {
                      id
                      name
                      options { id name }
                    }
                  }
                }
              }
            }
            repository(owner:$owner, name:$repo) {
              issue(number:$issueNumber) {
                projectItems(first:100) {
                  nodes {
                    id
                    project { id }
                  }
                }
              }
            }
          }'

          gh api graphql \
            -F owner="$OWNER" \
            -F repo="$REPO" \
            -F issueNumber="$ISSUE_NUMBER" \
            -F projectNumber="$PROJECT_NUMBER" \
            -f query="$QUERY" > /tmp/project.json

          PROJECT_ID=$(jq -r '.data.user.projectV2.id // empty' /tmp/project.json)
          FIELD_ID=$(jq -r '
            .data.user.projectV2.fields.nodes[]?
            | select(.name == "Status") | .id
          ' /tmp/project.json | head -n 1)
          OPTION_ID=$(jq -r --arg target "$TARGET_STATUS" '
            .data.user.projectV2.fields.nodes[]?
            | select(.name == "Status")
            | .options[]?
            | select(.name == $target) | .id
          ' /tmp/project.json | head -n 1)
          ITEM_ID=$(jq -r --arg project "$PROJECT_ID" '
            .data.repository.issue.projectItems.nodes[]?
            | select(.project.id == $project) | .id
          ' /tmp/project.json | head -n 1)

          if [ -z "$PROJECT_ID" ] || [ -z "$FIELD_ID" ] || [ -z "$OPTION_ID" ]; then
            echo "Could not find the user project, its Status field, or the target status option."
            exit 1
          fi

          if [ -z "$ITEM_ID" ]; then
            echo "This issue is not in the user project."
            exit 1
          fi

          gh api graphql -f query='
          mutation($projectId:ID!, $itemId:ID!, $fieldId:ID!, $optionId:String!) {
            updateProjectV2ItemFieldValue(input: {
              projectId:$projectId,
              itemId:$itemId,
              fieldId:$fieldId,
              value:{singleSelectOptionId:$optionId}
            }) {
              projectV2Item { id }
            }
          }' \
            -F projectId="$PROJECT_ID" \
            -F itemId="$ITEM_ID" \
            -F fieldId="$FIELD_ID" \
            -F optionId="$OPTION_ID"
